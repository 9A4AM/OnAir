<!doctype html>
<meta charset="utf-8"><title>Icon sheet</title>
<style>body{margin:0;font:11px system-ui;color:#999}.row{display:flex;flex-wrap:wrap}.d{background:#1b1d20}.l{background:#dfe3e6;color:#333}.c{width:92px;text-align:center;padding:4px 0}canvas{width:80px;height:80px}</style>
<div id="o"></div>
<script type="module">
import { SHAPES } from "../public/shapes.js";
import { drawShape } from "../public/icons.js";
const o = document.getElementById("o");
const col = (n) => n.startsWith("ship") ? "#8cb8eb" : n.startsWith("aprs") || n === "ham" ? "#8ccc9e" : n.startsWith("sat") ? "#9ad0f0" : n.startsWith("drone") ? "#e0ad6b" : "#e6e8ea";
for (const theme of ["d", "l"]) {
  const row = document.createElement("div"); row.className = "row " + theme; o.appendChild(row);
  for (const n of Object.keys(SHAPES)) {
    const cell = document.createElement("div"); cell.className = "c";
    const c = drawShape(n, theme === "l" && !n.startsWith("ship") ? "#4a5560" : col(n), 96, theme);
    cell.appendChild(c); cell.appendChild(document.createElement("br")); cell.append(n);
    row.appendChild(cell);
  }
}
</script>
