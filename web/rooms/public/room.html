<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnAir Live room</title><link rel="stylesheet" href="/rooms.css"></head>
<body><main class="room">
<header><a href="/">All rooms</a><h1 id="title">Connecting...</h1><div id="sub" class="sub"></div></header>
<canvas id="wf" width="512" height="240"></canvas>
<div class="cols">
  <section><h2>Decoded</h2><ul id="texts" class="log"></ul></section>
  <section><h2>Chat <span id="viewers" class="sub"></span></h2>
    <ul id="chat" class="log"></ul>
    <form id="form" autocomplete="off">
      <input id="nick" maxlength="20" placeholder="Nickname" aria-label="Nickname">
      <input id="msg" maxlength="200" placeholder="Say something" aria-label="Message">
      <button>Send</button>
    </form>
    <div id="note" class="sub"></div>
    <details id="host"><summary class="sub">I am the host</summary>
      <form id="hostform" autocomplete="off"><input id="pin" maxlength="16" placeholder="Host PIN from the app" aria-label="Host PIN"><button>Moderate</button></form>
      <div id="hostnote" class="sub"></div><h2>Reports</h2><ul id="reports" class="log" style="height:90px"></ul>
    </details>
  </section>
</div>
</main><script src="/room.js" type="module"></script></body></html>
