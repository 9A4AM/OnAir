name: CI

on:
  push:
    branches: [main, linux-port]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64", os: ubuntu-24.04, extra: "" }
          - { name: "Linux arm64", os: ubuntu-24.04-arm, extra: "" }
          - { name: "Linux x86_64 (scalar code paths)", os: ubuntu-24.04, extra: "-DDECT2_NO_SIMD=ON" }
          - { name: "macOS arm64", os: macos-14, extra: "" }
          - { name: "macOS arm64 (portable DSP, no SIMD)", os: macos-14, extra: "-DDECT2_PORTABLE=ON -DDECT2_NO_SIMD=ON" }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libhackrf-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config hackrf ffmpeg glfw
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=OFF ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 1500
