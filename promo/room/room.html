  cam.position.set(...a[1].map((v,j)=>lerp(v,b[1][j],k))); const tg=a[2].map((v,j)=>lerp(v,b[2][j],k)); cam.fov=lerp(a[3],b[3],k); cam.updateProjectionMatrix();
  cam.position.x+=Math.sin(t*.9)*.006; cam.position.y+=Math.sin(t*1.3+1)*.004; cam.lookAt(...tg); if(window.DEBUGCAM){ cam.position.set(...window.DEBUGCAM[0]); cam.lookAt(...window.DEBUGCAM[1]); } }
// ---------------------------------------------------------------- screens
const imgCache={}; function img(src){ return new Promise(res=>{ if(imgCache[src]) return res(imgCache[src]); const i=new Image(); i.onload=()=>{imgCache[src]=i; res(i)}; i.onerror=()=>res(null); i.src=src; }); }
const pad=(n,k)=>String(n).padStart(k,'0');
window.TV_ON=12.0;
async function screens(t){
  const mi=1+Math.floor(t*30)%420, pi=Math.floor(t*25)%500;
  const m=await img(`/tmp/mon/m_${pad(mi,4)}.jpg`), p=await img(`/tmp/progf/p_${pad(pi,4)}.jpg`);
  if(m){ monG.drawImage(m,0,0,1280,720); if(p) monG.drawImage(p,326*2/3,200*2/3,920*2/3,518*2/3); } monT.needsUpdate=true;
  // TV: dark standby -> "connecting" browser page -> live stream
  const on=window.TV_ON;
  tvG.fillStyle='#030304'; tvG.fillRect(0,0,1280,720);
  if(t>on-2.6&&t<on){ const a=Math.min(1,(t-(on-2.6))/.4); tvG.globalAlpha=a; tvG.fillStyle='#0d1014'; tvG.fillRect(0,0,1280,720); tvG.font='600 40px DejaVu Sans, sans-serif'; tvG.fillStyle='#8cc8ff'; tvG.textAlign='center'; tvG.fillText('OnAir',640,330); tvG.font='26px DejaVu Sans, sans-serif'; tvG.fillStyle='#9aa4ae'; tvG.fillText('Connecting to the receiver on your network…',640,380);
    const sp=t*6; for(let k=0;k<12;k++){ tvG.fillStyle=`rgba(140,200,255,${(k/12)})`; const a2=sp+k/12*Math.PI*2; tvG.fillRect(640+Math.cos(a2)*26-3,450+Math.sin(a2)*26-3,6,6); } tvG.globalAlpha=1; }
  if(t>=on&&p){ const a=Math.min(1,(t-on)/.25); tvG.globalAlpha=a; tvG.drawImage(p,0,0,1280,720); tvG.globalAlpha=1;
    const b=Math.min(1,Math.max(0,(t-on-.6)/.4))*(1-Math.min(1,Math.max(0,(t-on-4.2)/.5))); if(b>0){ tvG.globalAlpha=b; tvG.fillStyle='rgba(8,12,18,.78)'; tvG.fillRect(40,40,360,64); tvG.fillStyle='#4fb36a'; tvG.beginPath(); tvG.arc(70,72,7,0,7); tvG.fill(); tvG.font='600 24px DejaVu Sans, sans-serif'; tvG.fillStyle='#fff'; tvG.textAlign='left'; tvG.fillText('LIVE  ·  Channel One HD',88,81); tvG.globalAlpha=1; } }
  tvT.needsUpdate=true;
  tvLight.intensity = t>=on? 7*Math.min(1,(t-on)/.3)*(1+.08*Math.sin(t*3.1)) : (t>on-2.6? 1.5:0);
}
window.renderFrame=async(i)=>{ const t=i/30; chairAt(t); pose(figureAt(t)); camAt(t); await screens(t); R.render(S,cam); return t; };
